# systemd user environment for Linux desktop sessions (GNOME, KDE, …):
# GUI apps and IDEs started from the desktop see mise runtimes and XDG paths.
# Linked to ~/.config/environment.d/ by install.sh (desktop profile).
RUSTUP_HOME=${HOME}/.local/share/rustup
CARGO_HOME=${HOME}/.local/share/cargo
GOPATH=${HOME}/.local/share/go
PATH=${HOME}/.local/share/mise/shims:${HOME}/.local/bin:${PATH}
