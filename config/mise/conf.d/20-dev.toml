# Language runtimes and servers – desktop profile only (linked by install.sh).
# Installieren/aktualisieren: mise install / mise upgrade

[tools]
go     = "latest"
rust   = { version = "stable", components = ["rust-analyzer", "rust-src"] }  # default-Profil: rustfmt, clippy
node   = "lts"      # für coc.nvim
python = "3"

# Language-Server/Tools als eigene mise-Tools (überleben Runtime-Upgrades)
"go:golang.org/x/tools/gopls" = "latest"
ruff = "latest"
