# Language runtimes and servers – desktop profile only (linked by install.sh).
# Install/update: mise install / mise upgrade

[tools]
go     = "latest"
rust   = { version = "stable", components = ["rust-analyzer", "rust-src"] }  # default profile: rustfmt, clippy
node   = "lts"      # for coc.nvim
python = "3"

# Language servers/tools as separate mise tools (survive runtime upgrades)
"go:golang.org/x/tools/gopls" = "latest"
ruff = "latest"
