# Global mise settings (~/.config/mise/config.toml).
# Tools live in conf.d/:
#   20-dev.toml    language runtimes + language servers (desktop profile only)
#   90-local.toml  generated by install.sh: CLI tools the distro does not package
# Projects override with their own mise.toml.

[settings]
# `go install` goes to $GOPATH/bin instead of the per-version Go directory
go.set_gobin = false
