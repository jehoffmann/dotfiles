# tmux >= 3.2 – liegt unter ~/.config/tmux/tmux.conf (XDG), Plugins in ~/.config/tmux/plugins

# ── Prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Terminal ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"          # Italics, korrekte Farben in vim/nvim
set -as terminal-features ",xterm*:RGB"          # Truecolor
set -as terminal-features ",xterm*:hyperlinks"   # OSC 8 Links (eza, ls --hyperlink, gcc)
set -s  extended-keys on                         # Ctrl/Shift-Kombis bis in vim durchreichen
set -as terminal-features ",xterm*:extkeys"
set -g  allow-passthrough on                     # Bilder/OSC-Sequenzen (z.B. yazi, kitty-Protokoll)
set -s  set-clipboard on                         # OSC 52: Kopieren landet lokal, auch über SSH
set -sg escape-time 10                           # ESC-Latenz für vim
set -g  focus-events on

# ── Verhalten ───────────────────────────────────────────────────────────────
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on                      # keine Lücken nach Schließen
set -g  history-limit 50000
set -g  mouse on
setw -g mode-keys vi                             # Copy-Mode wie vim
set -g  detach-on-destroy off                    # Session schließen → zur nächsten statt raus
set -g  status-interval 5

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf neu geladen"

# ── Theme: Dracula (mit lizenziertem PRO: Farben aus lokal generierter Datei) ─
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon "#S"              # Session-Name links
set -g @dracula-plugins "git ssh-session time"
set -g @dracula-military-time true
set -g @dracula-time-format "%a %d.%m. %R"
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
source-file -q ~/.local/share/dracula-pro/generated/tmux.conf

# ── Session-Persistenz ─────────────────────────────────────────────────────
set -g @continuum-restore 'on'                   # beim Start letzte Sessions wiederherstellen
set -g @resurrect-strategy-vim 'session'         # vim-Sessions (Session.vim) mit wiederherstellen

# ── Plugins (TPM) ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'     # muss nach resurrect und nach dem Theme stehen
set -g @plugin 'tmux-plugins/tmux-yank'

# TPM und fehlende Plugins beim Start installieren
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
if "test ! -d ~/.config/tmux/plugins/tmux-sensible" \
   "run '~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
