# tmux >= 3.2 – liegt unter ~/.config/tmux/tmux.conf (XDG), Plugins in ~/.config/tmux/plugins

# ── Prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Terminal ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"          # Italics, korrekte Farben in vim/nvim
set -as terminal-features ",xterm*:RGB"          # Truecolor
set -as terminal-features ",xterm*:hyperlinks"   # OSC 8 Links (eza, ls --hyperlink, gcc)
set -s  extended-keys on                         # Ctrl/Shift-Kombis bis in vim durchreichen
set -as terminal-features ",xterm*:extkeys"
set -g  allow-passthrough on                     # Bilder/OSC-Sequenzen (z.B. yazi, kitty-Protokoll)
set -s  set-clipboard on                         # OSC 52: Kopieren landet lokal, auch über SSH
set -sg escape-time 10                           # ESC-Latenz für vim
set -g  focus-events on

# ── Verhalten ───────────────────────────────────────────────────────────────
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on                      # keine Lücken nach Schließen
set -g  history-limit 50000
set -g  mouse on
setw -g mode-keys vi                             # Copy-Mode wie vim
set -g  detach-on-destroy off                    # Session schließen → zur nächsten statt raus
set -g  status-interval 5

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf neu geladen"

# ── Theme: Catppuccin (passend zu starship/bat) ────────────────────────────
set -g @catppuccin_flavor 'latte'                # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'

# ── Session-Persistenz ─────────────────────────────────────────────────────
set -g @continuum-restore 'on'                   # beim Start letzte Sessions wiederherstellen
set -g @resurrect-strategy-vim 'session'         # vim-Sessions (Session.vim) mit wiederherstellen

# ── Plugins (TPM) ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'     # muss nach resurrect und nach dem Theme stehen
set -g @plugin 'tmux-plugins/tmux-yank'

# TPM bei Bedarf installieren
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
