# tmux >= 3.0 – ~/.config/tmux/tmux.conf (XDG; tmux < 3.1 gets ~/.tmux.conf from install.sh)
# Plugins live in ~/.config/tmux/plugins

# ── Prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Terminal ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"          # italics, correct colours in vim/nvim
set -s  set-clipboard on                         # OSC 52: copies reach the local clipboard, even over SSH
set -sg escape-time 10                           # ESC latency for vim
set -g  focus-events on

# Newer features only where tmux supports them (Ubuntu 20.04: 3.0, 22.04: 3.2).
# tmux < 3.2 has no #{version}; the condition is then false, which is correct.
%if "#{>=:#{version},3.2}"
set -as terminal-features ",xterm*:RGB"          # true colour
set -s  extended-keys on                         # pass Ctrl/Shift combos through to vim
set -as terminal-features ",xterm*:extkeys"
%else
set -ga terminal-overrides ",xterm*:Tc"          # true colour, pre-3.2 syntax
%endif
%if "#{>=:#{version},3.3}"
set -g  allow-passthrough on                     # images/OSC sequences (e.g. yazi, kitty protocol)
%endif
%if "#{>=:#{version},3.4}"
set -as terminal-features ",xterm*:hyperlinks"   # OSC 8 links (eza, ls --hyperlink, gcc)
%endif

# ── Behaviour ───────────────────────────────────────────────────────────────
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on                      # no gaps after closing a window
set -g  history-limit 50000
set -g  mouse on
setw -g mode-keys vi                             # copy mode like vim
set -g  detach-on-destroy off                    # closing a session switches to the next one
set -g  status-interval 5

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Theme: Dracula (licensed PRO: colours from a locally generated file) ────
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon "#S"              # session name on the left
set -g @dracula-plugins "git ssh-session time"
set -g @dracula-military-time true
set -g @dracula-time-format "%a %d.%m. %R"
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
source-file -q ~/.local/share/dracula-pro/generated/tmux.conf

# ── Session persistence ────────────────────────────────────────────────────
set -g @continuum-restore 'on'                   # restore the last sessions on start
set -g @resurrect-strategy-vim 'session'         # also restore vim sessions (Session.vim)

# ── Plugins (TPM) ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'     # must come after resurrect and after the theme
set -g @plugin 'tmux-plugins/tmux-yank'

# Bootstrap TPM, load plugins, then install missing ones (incl. newly added)
# and load again if something was installed. install_plugins needs the plugin
# path that tpm sets, so it has to run after tpm.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run 'T=~/.config/tmux/plugins/tpm; $T/tpm; case "$($T/bin/install_plugins 2>/dev/null)" in *"download success"*) $T/tpm ;; esac; true'
